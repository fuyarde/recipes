<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gâteau yaourt prot</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../favicon.svg" />
</head>
<body>
    <div class="container">
        <h1>Gâteau yaourt prot</h1>
        <div class="infos">
            <p><strong>Préparation</strong> : 5 minutes</p>
            <p><strong>Cuisson</strong> : </p>
            <p><strong>Parts</strong> : 1</p>
        </div>
        <h2>Ingrédients</h2>
        <ul>
            <li><strong>2</strong> petits suisses</li>
<li><strong>1</strong> oeuf</li>
<li>quelques pépites</li>
        </ul>
        <h2>Instructions</h2>
        <ol>
            <li>Préchauffez le four à 200°C</li>
<li>Dans un saladier, mélangez le tout</li>
<li>Versez dans un moule à gâteau beurré</li>
<li>Enfournez pendant 25 minutes</li>
        </ol>
    </div>
</body>
</html>
